<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Панель адміністратора</title>
    <link rel="stylesheet" href="/style.css?v=10">
    <style>
        .admin-page {
            padding: 24px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-width: 180px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
            background: #020617;
        }

        th, td {
            border: 1px solid #1e293b;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #1e293b;
        }

        button {
            margin-right: 6px;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .danger {
            background: #ef4444;
            color: white;
        }

        .warning {
            background: #f59e0b;
            color: black;
        }

        .success {
            background: #22c55e;
            color: white;
        }
    </style>
</head>
<body>

<div class="admin-page">

    <div class="admin-header">
        <h1>Панель адміністратора</h1>
        <button onclick="window.location.href='/'">Повернутися до дошки</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3>Користувачі</h3>
            <div id="usersCount">0</div>
        </div>

        <div class="stat-card">
            <h3>Дошки</h3>
            <div id="boardsCount">0</div>
        </div>
    </div>

    <h2>Користувачі</h2>
    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Пошта</th>
                <th>Роль</th>
                <th>Заблокований</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>

    <h2>Дошки</h2>
    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Назва</th>
                <th>Власник</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="boardsTable"></tbody>
    </table>

</div>

<script src="/admin.js?v=10"></script>

</body>
</html>
