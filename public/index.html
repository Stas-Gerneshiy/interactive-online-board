<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Інтерактивна онлайн-дошка</title>
    <link rel="stylesheet" href="/style.css?v=10">
</head>
<body class="board-body">

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">🧠 Online Board</div>
        <button id="addBoard">+ Дошка</button>
        
        <div id="boardsList"></div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div class="title">Інтерактивна онлайн-дошка</div>
            <div class="actions">
                <button id="adminBtn" style="display:none;">Admin</button>
                <button id="logoutBtn">Вийти</button>
                <button id="addNote">+ Нотатка</button>
                <button id="addRect">+ Прямокутник</button>
                <button id="addLine">+ Лінія</button>
                <button id="shareBoard">Поділитися</button>
            </div>
        </div>

        <div id="boardViewport">
            <div id="board"></div>
        </div>

    </div>

</div>

<div id="boardMenu" class="board-menu"></div>
<div id="shareMenu" class="board-menu"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/script.js?v=10"></script>

</body>
</html>
